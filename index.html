<script>
(() => {
'use strict';

/* ================= 工具 ================= */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const TAU = Math.PI * 2;

/* ================= 画布 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1, groundY = 0, cx = 0, potTopY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg.width = W * DPR; bg.height = H * DPR;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H * 0.8; cx = W * 0.5; potTopY = groundY - 58;
  buildBackground();
}

/* ---------- 静态背景 ---------- */
let stars = [], twinkles = [];

function ridgePoints(amp, base, n, seed) {
  const pts = []; let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i <= n; i++) pts.push([i / n * W, base - rnd() * amp]);
  return pts;
}

function drawRidge(pts, color) {
  bctx.fillStyle = color;
  bctx.beginPath();
  bctx.moveTo(-10, H);
  for (const p of pts) bctx.lineTo(p[0], p[1]);
  bctx.lineTo(W + 10, H);
  bctx.closePath();
  bctx.fill();
}

function drawPot(x, y) {
  bctx.fillStyle = '#241c12';
  bctx.fillRect(x - 48, y - 6, 9, 14); bctx.fillRect(x + 39, y - 6, 9, 14);
  bctx.beginPath();
  bctx.moveTo(x - 74, y - 52); bctx.lineTo(x + 74, y - 52);
  bctx.lineTo(x + 52, y); bctx.lineTo(x - 52, y);
  bctx.closePath();
  const g = bctx.createLinearGradient(x - 74, y - 52, x + 74, y);
  g.addColorStop(0, '#4a3826'); g.addColorStop(.5, '#6b5233'); g.addColorStop(1, '#38291b');
  bctx.fillStyle = g; bctx.fill();
  bctx.strokeStyle = '#241a10'; bctx.lineWidth = 3; bctx.stroke();
  bctx.fillStyle = '#7a5c37';
  bctx.beginPath(); bctx.ellipse(x, y - 52, 80, 16, 0, 0, TAU); bctx.fill();
  bctx.strokeStyle = '#4a3826'; bctx.lineWidth = 2.5; bctx.stroke();
  bctx.fillStyle = '#140d08';
  bctx.beginPath(); bctx.ellipse(x, y - 52, 64, 10.5, 0, 0, TAU); bctx.fill();
  bctx.strokeStyle = '#8a6b3f'; bctx.lineWidth = 2;
  bctx.beginPath(); bctx.moveTo(x - 60, y - 24); bctx.lineTo(x + 60, y - 24); bctx.stroke();
  bctx.strokeStyle = '#8a6b3f'; bctx.lineWidth = 1.5;
  bctx.beginPath(); bctx.moveTo(x - 40, y - 10); bctx.lineTo(x + 40, y - 10); bctx.stroke();
}

function buildBackground() {
  const sky = bctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d1030');
  sky.addColorStop(.45, '#2a2350');
  sky.addColorStop(.72, '#7a3f63');
  sky.addColorStop(.88, '#c96a4e');
  sky.addColorStop(1, '#2a1a2e');
  bctx.fillStyle = sky; bctx.fillRect(0, 0, W, H);

  stars = [];
  const nStars = Math.floor(W * H / 9000);
  for (let i = 0; i < nStars; i++) stars.push({ x: rand(0, W), y: rand(0, H * 0.55), r: rand(.5, 1.7) });
  twinkles = [];
  for (let i = 0; i < 8; i++) twinkles.push({ x: rand(0, W), y: rand(0, H * 0.5), r: rand(1.2, 2.4), ph: rand(0, TAU) });

  bctx.fillStyle = '#ffffff';
  for (const s of stars) { bctx.globalAlpha = rand(.25, .8); bctx.beginPath(); bctx.arc(s.x, s.y, s.r, 0, TAU); bctx.fill(); }
  bctx.globalAlpha = 1;

  /* 月亮 */
  const mx = W * 0.82, my = H * 0.14, mr = 34;
  const mg = bctx.createRadialGradient(mx, my, mr * .2, mx, my, mr * 3);
  mg.addColorStop(0, 'rgba(255,240,200,.5)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  bctx.fillStyle = mg;
  bctx.beginPath(); bctx.arc(mx, my, mr * 3, 0, TAU); bctx.fill();
  bctx.fillStyle = '#fff3d6';
  bctx.beginPath(); bctx.arc(mx, my, mr, 0, TAU); bctx.fill();
  bctx.fillStyle = '#f0dcb8';
  bctx.beginPath(); bctx.arc(mx - 12, my - 6, 7, 0, TAU); bctx.fill();
  bctx.beginPath(); bctx.arc(mx + 10, my + 9, 5, 0, TAU); bctx.fill();

  /* 远山 */
  drawRidge(ridgePoints(H * 0.10, groundY - 46, 14, 7), '#3a3358');
  drawRidge(ridgePoints(H * 0.08, groundY - 12, 12, 21), '#2c2745');
  drawRidge(ridgePoints(H * 0.055, groundY + 10, 10, 33), '#221d38');

  /* 地面 */
  const gd = bctx.createLinearGradient(0, groundY - 14, 0, H);
  gd.addColorStop(0, '#1a1c10'); gd.addColorStop(1, '#0a0c07');
  bctx.fillStyle = gd; bctx.fillRect(0, groundY - 14, W, H - groundY + 14);
  bctx.fillStyle = 'rgba(255,220,150,.05)';
  for (let i = 0; i < 40; i++) bctx.fillRect(rand(0, W), rand(groundY, H), rand(30, 90), 1.5);

  /* 供桌 + 蜡烛（简单剪影） */
  bctx.fillStyle = '#241a12';
  bctx.fillRect(cx - 150, groundY - 6, 300, 8);
  bctx.fillRect(cx - 150, groundY - 18, 8, 18); bctx.fillRect(cx + 142, groundY - 18, 8, 18);
  /* 蜡烛 */
  for (const lx of [cx - 118, cx + 118]) {
    bctx.fillStyle = '#d8cfa8';
    bctx.fillRect(lx - 5, groundY - 40, 10, 34);
    bctx.fillStyle = '#8a7a5a';
    bctx.fillRect(lx - 2, groundY - 44, 4, 6);
  }

  /* 火盆 */
  drawPot(cx, groundY);

  bctx.fillStyle = 'rgba(255,150,60,.14)';
  bctx.beginPath(); bctx.ellipse(cx, groundY + 8, 110, 16, 0, 0, TAU); bctx.fill();
}

/* ================= 状态 ================= */
let t = 0;
let particles = [];
let papers = [];
let rockets = [];
let flash = 0;
let combo = 0, comboTimer = 0;
let burnCount = 0, merit = 0;
let autoBurn = false, autoTimer = null, holdTimer = null;
let autoToastCount = 0;
let localAudio = null, localBgmActive = false, localSongName = '', localURL = null;

/* ================= 掉落表 ================= */
const RARITIES = {
  common:     { label: '普通',     color: '#cdcdcd' },
  rare:       { label: '稀有',     color: '#5fd35f' },
  epic:       { label: '史诗',     color: '#4aa3ff' },
  legendary:  { label: '传说',     color: '#c04dff' },
  myth:       { label: '氪金至尊', color: '#ffb800' },
  manuscript: { label: '策划手稿', color: '#ffe9a8' },
};

const LOOT = {
  common: { weight: 40, items: [
    { name: '安慰奖', desc: '系统鼓励您继续烧纸，下次一定。' },
    { name: '1 金币', desc: '到账需缴纳 99% 手续费，实收 0.01。' },
    { name: '无门槛优惠券', desc: '满 10000 减 5，仅限指定不可用商品。' },
    { name: '幸运符', desc: '使用后下次保底必出【安慰奖】。' },
    { name: '体力药水', desc: '服用后体力 -10，眩晕 3 秒。' },
    { name: '大喇叭', desc: '喊话全服："我很非，勿念。"' },
    { name: '经验值 +1', desc: '升到 2 级需要 100000000 经验。' },
    { name: '蚊子腿', desc: '集齐 9999 根可兑换"蚊子腿碎片"。' },
  ]},
  rare: { weight: 26, items: [
    { name: '首充双倍券', desc: '充值 648 元，到账 0.0001 元，双倍后 0.0002。' },
    { name: '十连抽券', desc: '十连必出 9 个碎片 + 1 个保底碎片。' },
    { name: '保底计数器', desc: '使用后保底进度归零，重新开始。' },
    { name: '复活币', desc: '仅限 VIP18 及以上使用。' },
    { name: '改名卡', desc: '改完后系统自动更名为"韭菜"。' },
    { name: '加速券', desc: '加速后加载变得更慢。' },
  ]},
  epic: { weight: 15, items: [
    { name: '限定皮肤·7天', desc: '有效期 7 天，其中 6 天服务器维护。' },
    { name: '自动扣款月卡', desc: '每月自动扣款，取消按钮在第 18 层菜单。' },
    { name: '概率 UP 券', desc: 'UP 后概率从 0.01% 提升至 0.02%。' },
    { name: '离线收益', desc: '离线收益需在线连续领取 72 小时。' },
    { name: '保底必出券', desc: '仅对非限定池生效，而您的目标在限定池。' },
    { name: '体力月卡', desc: '每日体力 +5，体力上限 -5。' },
  ]},
  legendary: { weight: 9, items: [

/* ================= 音频引擎 ================= */
let AC = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let musicOn = true, sfxOn = true;
let musicTimer = null, nextNote = 0, step = 0;

const NOTES = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.51, B5: 987.77 };
const MELODY = [
  'E5','G5','A5','G5','E5','D5','C5','D5',
  'E5','G5','A5','C6','A5','G5','E5','D5',
  'E5','G5','A5','G5','E5','D5','C5','D5',
  'E5','G5','A5','C6','C6','A5','G5','E5',
].map(n => NOTES[n]);
const BASS_ROOTS = [130.81, 98, 110, 87.31]; // C3 G2 A2 F2
const BPM = 134, STEP = 60 / BPM / 2;

function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    sfxBus = AC.createGain(); sfxBus.gain.value = 0.72; sfxBus.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { console.warn('audio unavailable', e); }
}

function tone(freq, t0, dur, opt) {
  opt = opt || {};
  const isMusic = opt.bus === 'music';
  const bus = isMusic ? musicBus : sfxBus;
  if (!AC || !bus) return;
  if (isMusic ? !musicOn : !sfxOn) return;
  const o = AC.createOscillator();
  o.type = opt.type || 'triangle';
  o.frequency.setValueAtTime(freq, t0);
  if (opt.slideTo) o.frequency.exponentialRampToValueAtTime(opt.slideTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(opt.vol || 0.15, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = o;
  if (opt.lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp; node.connect(f); node = f; }
  node.connect(g); g.connect(bus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

function noiseBurst(t0, dur, opt) {
  opt = opt || {};
  const isMusic = opt.bus === 'music';
  const bus = isMusic ? musicBus : sfxBus;
  if (!AC || !bus || !noiseBuf) return;
  if (isMusic ? !musicOn : !sfxOn) return;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = opt.type || 'bandpass';
  f.frequency.setValueAtTime(opt.freq || 1000, t0);
  f.Q.value = opt.q || 1;
  if (opt.sweepTo) f.frequency.exponentialRampToValueAtTime(opt.sweepTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(opt.vol || 0.12, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(bus);
  src.start(t0); src.stop(t0 + dur + 0.05);
}

const sfx = {
  whoosh() { if (!AC) return; const now = AC.currentTime; noiseBurst(now, 0.3, { type: 'bandpass', freq: 380, q: 2.5, vol: 0.12, sweepTo: 1600 }); },
  crackle() { if (!AC) return; const now = AC.currentTime; for (let i = 0; i < 4; i++) noiseBurst(now + Math.random() * 0.18, 0.06, { type: 'highpass', freq: 2600, vol: 0.045 }); },
  paper() { if (!AC) return; const now = AC.currentTime; noiseBurst(now, 0.08, { type: 'bandpass', freq: 2000, q: 4, vol: 0.05 }); },
  boom(tier) { if (!AC) return; const now = AC.currentTime; const v = 0.14 + 0.05 * (tier || 1);
    tone(110, now, 0.55, { type: 'sine', vol: v, slideTo: 38 });
    noiseBurst(now, 0.38, { type: 'lowpass', freq: 900, q: 0.8, vol: v * 0.8, sweepTo: 120 }); },
  ding() { if (!AC) return; const now = AC.currentTime; tone(987.77, now, 0.4, { type: 'sine', vol: 0.1 }); tone(1318.51, now + 0.06, 0.5, { type: 'sine', vol: 0.09 }); },
  fanfare() { if (!AC) return; const now = AC.currentTime;
    [659.25, 783.99, 987.77, 1318.51].forEach((f, i) => tone(f, now + i * 0.09, 0.5, { type: 'triangle', vol: 0.13 })); },
};

function startMusic() {
  if (musicTimer) return;
  step = 0; nextNote = AC.currentTime + 0.1;
  musicTimer = setInterval(() => {
    if (!AC) return;
    while (nextNote < AC.currentTime + 0.14) {
      scheduleStep(step, nextNote);
      nextNote += STEP; step = (step + 1) % 32;
    }
  }, 25);
}

function scheduleStep(s, t0) {
  if (localBgmActive) return; // 本地音乐宣战中：内置合成乐让位
  const mel = MELODY[s];
  if (mel) {
    tone(mel, t0, 0.22, { type: 'triangle', vol: 0.13, bus: 'music' });
    tone(mel, t0, 0.2, { type: 'sine', vol: 0.06, bus: 'music' });
  }
  if (s % 8 === 0) tone(NOTES.E6, t0, 0.5, { type: 'sine', vol: 0.045, bus: 'music' });
  const bar = Math.floor(s / 8);
  const root = BASS_ROOTS[bar];
  const bs = s % 8;
  if (bs === 0 || bs === 2) tone(root, t0, 0.2, { type: 'triangle', vol: 0.17, bus: 'music' });
  else if (bs === 4 || bs === 6) tone(root * 2, t0, 0.18, { type: 'triangle', vol: 0.13, bus: 'music' });
  if (s % 2 === 0) noiseBurst(t0, 0.05, { type: 'highpass', freq: 6000, vol: s % 4 === 0 ? 0.05 : 0.028, bus: 'music' });
  if (s % 4 === 0) tone(140, t0, 0.13, { type: 'sine', vol: 0.3, slideTo: 45, bus: 'music' });
  if (s % 8 === 2 || s % 8 === 6) noiseBurst(t0, 0.14, { type: 'bandpass', freq: 1500, q: 1.2, vol: 0.13, bus: 'music' });
}

  if (type === 'double') { spawnSphere(x - 16, y, tier, c); spawnSphere(x + 16, y, tier, c); }
  else if (type === 'ring') spawnRing(x, y, tier, c);
  else if (type === 'palm') spawnPalm(x, y, tier, c);

  else if (type === 'heart') spawnHeart(x, y, tier, ['#ff8fab', '#ff4d6d', '#ffb3c6']);

  if (tier >= 3) flash = 0.8;
}

/* ================= 掉落 ================= */
let collection = { items: {}, mss: {} };
let mssOrder = [];
const MSS_NAMES = LOOT.manuscript.items.map(it => it.name);

function load() {
  try {
    const raw = localStorage.getItem('kaice-shaozhi-v1');
    if (raw) {
      const d = JSON.parse(raw);
      burnCount = d.burns || 0; merit = d.merit || 0;
      if (d.items) collection.items = d.items;
      const names = d.mss || [];
      mssOrder = names.filter(n => MSS_NAMES.includes(n));
      collection.mss = {};
      for (const n of mssOrder) {
        const it = LOOT.manuscript.items.find(x => x.name === n);
        if (it) collection.mss[n] = it;
      }
    }
  } catch (e) { /* ignore */ }
  mssOrder = mssOrder.length ? mssOrder : MSS_NAMES.filter(n => collection.mss[n]);
  statBurns.textContent = burnCount;
  statMerit.textContent = merit;
  statMerit.classList.toggle('neg', merit < 0);
  updateMssBadge();
  updateBkBadge();
}

function save() {
  try {
    localStorage.setItem('kaice-shaozhi-v1', JSON.stringify({ burns: burnCount, merit, mss: mssOrder, items: collection.items }));
  } catch (e) { /* ignore */ }
}

function rollLoot() {
  const totalW = Object.values(LOOT).reduce((s, r) => s + r.weight, 0);
  let roll = Math.random() * totalW;
  let rarKey = 'common';
  for (const k of Object.keys(LOOT)) { roll -= LOOT[k].weight; if (roll <= 0) { rarKey = k; break; } }
  const rar = RARITIES[rarKey];
  const item = pick(LOOT[rarKey].items);
  collection.items[item.name] = (collection.items[item.name] || 0) + 1;
  updateBkBadge();

  if (rarKey === 'manuscript') {
    if (!collection.mss[item.name]) {
      collection.mss[item.name] = item;
      mssOrder.push(item.name);
      updateMssBadge();
      save();
      announce('📜 掉落策划手稿：' + item.name, rar.color);
      floatText(cx, potTopY - 130, '快把手稿收进阅览室！', rar.color);
      sfx.fanfare();
      launchRocket(3, false);
      setTimeout(() => explode(rand(W * 0.2, W * 0.8), rand(H * 0.15, H * 0.4), 2, ['#ffe9a8', '#ffd166', '#c9a24a']), 300);
    } else {
      floatText(cx, potTopY - 120, '重复手稿 ×1（可兑换 0 元宝）', '#cdcdcd');
      sfx.ding();
    }
    return;
  }

  popDrop(item, rar);
  addLog(item, rar);
  if (rarKey === 'common' || rarKey === 'rare') sfx.ding();
  if (rarKey === 'epic') { announce('★ 史诗：' + item.name, rar.color); sfx.ding(); launchRocket(1, false); }
  if (rarKey === 'legendary') { announce('★ 传说掉落：' + item.name, rar.color); sfx.fanfare(); launchRocket(2, false); }
  if (rarKey === 'myth') {
    announce('★ 氪金至尊掉落：' + item.name + ' ★', rar.color);
    sfx.fanfare();
    launchRocket(3, false);
    setTimeout(() => launchRocket(3, false), 240);
    setTimeout(() => launchRocket(3, false), 480);
    for (let i = 0; i < 30; i++) particles.push({ kind: 'ember', x: rand(0, W), y: rand(-40, 0),
      vx: rand(-20, 20), vy: rand(60, 160), grav: 60, life: rand(1.5, 3), maxLife: 3,
      size: rand(1.8, 3.6), color: pick(['#ffd700', '#ffe066', '#ffb800']) });
  }
}

}

/* ================= 更新 ================= */
function update(dt) {
  t += dt;
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { combo = 0; updateComboUI(); } }
  if (flash > 0) flash = Math.max(0, flash - dt * 1.8);

  /* 火盆常驻火焰 */
  for (let i = 0; i < 4; i++) spawnFlame(cx + rand(-48, 48), potTopY - 30, rand(0.55, 1));
  if (Math.random() < 0.4) spawnSmoke(cx + rand(-20, 20), potTopY - 34);
  if (Math.random() < 0.5) spawnEmber(cx + rand(-46, 46), potTopY - 26, null);

  /* 粒子 */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      if (p.kind === 'crackleSeed') {
        for (let k = 0; k < 4; k++) particles.push({ kind: 'twinkle', x: p.x, y: p.y,
          vx: rand(-120, 120), vy: rand(-120, 120), grav: 260, life: 0.35, maxLife: 0.35,
          size: 1.3, color: '#fff6d8' });
      }
      particles.splice(i, 1);
      continue;
    }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'flame') p.vx += Math.sin(t * 22 + p.seed) * 30 * dt;
    if (p.y > H + 30 || p.x < -40 || p.x > W + 40) { particles.splice(i, 1); continue; }
  }
  if (particles.length > 2400) particles.splice(0, particles.length - 2400);

  /* 纸钱 */
  for (let i = papers.length - 1; i >= 0; i--) {
    const p = papers[i];
    p.t += dt;
    if (p.state === 'fly') {
      p.vy += 520 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.rotV * dt;
      if (Math.hypot(p.x - p.tx, p.y - p.ty) < 26 || p.y > potTopY + 6) {
        p.state = 'burn'; p.t = 0; p.x = p.tx; p.y = p.ty;
        for (let k = 0; k < 10; k++) spawnFlame(p.x + rand(-10, 10), p.y + rand(-8, 2), rand(0.4, 0.7));
        sfx.crackle();
      }
    } else {
      p.rot += p.rotV * 4 * dt;
      p.scale = Math.max(0, 1 - p.t / 0.55);
      if (Math.random() < 0.5) spawnFlame(p.x + rand(-9, 9), p.y + rand(-7, 2), rand(0.35, 0.65));
      if (p.t > 0.55) { papers.splice(i, 1); onPaperBurned(); }
    }
  }

  /* 火箭 */
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    r.x += r.vx * dt; r.y += r.vy * dt;
    r.vx += Math.sin(t * 9 + i) * 6 * dt;
    if (Math.random() < 0.7) particles.push({ kind: 'trail', x: r.x, y: r.y,
      vx: rand(-12, 12), vy: rand(-12, 12), grav: 0, life: 0.35, maxLife: 0.35,
      size: 2.2, color: '#ffe9a8' });
    if (r.y <= r.ty || r.t > r.life) {
      rockets.splice(i, 1);
      explode(r.x, r.y, r.tier, r.heart ? ['#ff8fab', '#ff4d6d', '#ffb3c6'] : null);
    }
  }
}

/* ================= 绘制 ================= */
function draw() {
  ctx.drawImage(bg, 0, 0, W, H);

  /* 闪烁星星 */
  ctx.fillStyle = '#fff';
  for (const s of twinkles) {
    ctx.globalAlpha = 0.4 + 0.5 * Math.abs(Math.sin(t * 1.6 + s.ph));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 蜡烛火焰 */
  for (const lx of [cx - 118, cx + 118]) {
    const fy = groundY - 46;
    const fh = 10 + Math.sin(t * 9 + lx) * 3 + rand(-1, 1);
    ctx.fillStyle = 'rgba(255,190,80,.85)';
    ctx.beginPath(); ctx.arc(lx, fy - fh / 2, fh * 0.42, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.9)';
    ctx.beginPath(); ctx.arc(lx, fy - fh / 2, fh * 0.2, 0, TAU); ctx.fill();
  }

  /* 火盆火光 */
  const glowR = 95 + Math.sin(t * 7) * 7 + Math.random() * 9;
  const gg = ctx.createRadialGradient(cx, potTopY - 24, 8, cx, potTopY - 24, glowR);
  gg.addColorStop(0, 'rgba(255,160,60,.55)');
  gg.addColorStop(0.5, 'rgba(255,110,30,.22)');
  gg.addColorStop(1, 'rgba(255,110,30,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(cx, potTopY - 24, glowR, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 粒子 */
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    if (p.kind === 'smoke') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = '#9a9278';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.7 - a * 0.7), 0, TAU); ctx.fill();
      continue;
    }
    ctx.globalCompositeOperation = 'lighter';
    if (p.kind === 'flame') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.45 + a * 0.55), 0, TAU); ctx.fill();
    } else if (p.kind === 'ember') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU); ctx.fill();
    } else if (p.kind === 'trail') {
      ctx.globalAlpha = a * 0.65;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU); ctx.fill();
    } else {
      let al = a;
      if (p.kind === 'twinkle') al = a * (0.35 + 0.65 * Math.abs(Math.sin(p.life * 14)));
      ctx.globalAlpha = al;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill();
      if (p.kind === 'palm') {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = al * 0.55;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* 纸钱 */
  for (const p of papers) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.scale, p.scale);
    const burning = p.state === 'burn';
    ctx.fillStyle = burning ? '#ff9a3c' : '#f2e2ae';
    ctx.fillRect(-17, -10, 34, 20);
    ctx.strokeStyle = burning ? '#d96a1a' : '#d9a24a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-17, -10, 34, 20);
    ctx.fillStyle = burning ? '#ffd9a0' : '#b33';
    ctx.globalAlpha = burning ? 0.5 : 0.8;
    ctx.fillRect(-8, -5, 7, 10);
    ctx.fillStyle = burning ? '#ff9a3c' : '#f2e2ae';
    ctx.globalAlpha = burning ? 0.6 : 1;
    ctx.beginPath(); ctx.arc(8, 0, 3, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* 全屏闪光 */
  if (flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = flash * 0.22;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ================= 输入 ================= */
function onPointer(e) {
  const x = e.clientX, y = e.clientY;
  burn(x, y);
  clearInterval(holdTimer);
  holdTimer = setInterval(() => burn(x + rand(-18, 18), y + rand(-18, 18)), 230);
}
function endHold() { clearInterval(holdTimer); holdTimer = null; }

document.addEventListener('pointerdown', e => { if (e.target === canvas) onPointer(e); });
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
window.addEventListener('blur', endHold);
window.addEventListener('resize', resize);

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (modal.classList.contains('hidden') && payModal.classList.contains('hidden') && bkModal.classList.contains('hidden')) {
      burn(cx + rand(-60, 60), potTopY - 180);
    }
  }
  if (e.key === 'm' || e.key === 'M') setMusic(!musicOn);
});

/* ================= 按钮 ================= */
function setMusic(on) {
  musicOn = on;
  $('btnMusic').textContent = on ? '♪ 音乐：开' : '♪ 音乐：关';
  $('btnMusic').classList.toggle('on', on);
  if (on) {
    if (localBgmActive) { if (localAudio) localAudio.play().catch(() => {}); }
    else ensureAudio();
  } else if (localBgmActive && localAudio) {
    localAudio.pause();
  }
}
function setSfx(on) {
  sfxOn = on;
  $('btnSfx').textContent = on ? '🔊 音效：开' : '🔊 音效：关';
  $('btnSfx').classList.toggle('on', on);
}

$('btnMusic').addEventListener('click', () => setMusic(!musicOn));
$('btnSfx').addEventListener('click', () => setSfx(!sfxOn));

$('btnAuto').addEventListener('click', () => {
  autoBurn = !autoBurn;
  $('btnAuto').textContent = autoBurn ? '⏳ 自动烧纸：开' : '⏳ 自动烧纸：关';
  $('btnAuto').classList.toggle('on', autoBurn);

    }, 650);

  }
});

$('btnLib').addEventListener('click', () => { ensureAudio(); openLib(); });
$('modalClose').addEventListener('click', () => modal.classList.add('hidden'));

$('bkClose').addEventListener('click', () => bkModal.classList.add('hidden'));

/* ---------- 本地音乐 · 宣战 ---------- */
localAudio = new Audio();
localAudio.loop = true;
localAudio.addEventListener('error', () => {
  if (localSongName) floatText(cx, potTopY - 130, '该音频无法播放：格式可能不支持', '#ff6b6b');
});
$('btnLocal').addEventListener('click', () => { ensureAudio(); $('fileAudio').click(); });
$('btnLocalX').addEventListener('click', stopLocalBgm);
$('fileAudio').addEventListener('change', () => {
  const f = $('fileAudio').files && $('fileAudio').files[0];
  $('fileAudio').value = '';
  if (!f) return;
  ensureAudio();
  if (localURL) URL.revokeObjectURL(localURL);
  localURL = URL.createObjectURL(f);
  localAudio.src = localURL;
  localAudio.play().then(() => {
    localBgmActive = true;
    localSongName = f.name.replace(/\.[^.]+$/, '');
    $('btnLocal').textContent = '🎵 ' + localSongName;
    $('btnLocalX').style.display = '';
    floatText(cx, potTopY - 130, '🎵 BGM 已换成《' + localSongName + '》· 宣战成功', '#7bd88f');
    if (!musicOn) { musicOn = true; setMusic(true); }
  }).catch(() => {
    floatText(cx, potTopY - 130, '播放失败：格式不支持或需重新点击', '#ff6b6b');
  });
});

function stopLocalBgm() {
  if (localAudio) { localAudio.pause(); localAudio.src = ''; }
  if (localURL) { URL.revokeObjectURL(localURL); localURL = null; }
  localBgmActive = false;
  localSongName = '';
  $('btnLocal').textContent = '🎵 本地 BGM';
  $('btnLocalX').style.display = 'none';
  floatText(cx, potTopY - 130, '已恢复内置音乐', '#ffe9b0');
  if (musicOn) ensureAudio();
}

$('payYes').addEventListener('click', () => {
  payModal.classList.add('hidden');
  merit -= 648;
  statMerit.textContent = merit;
  statMerit.classList.toggle('neg', merit < 0);
  floatText(cx, potTopY - 130, '感谢您为本游戏续命 0.1 秒！功德 -648', '#ffb800');
  for (let i = 0; i < 24; i++) particles.push({ kind: 'ember', x: cx + rand(-90, 90), y: potTopY - 120,
    vx: rand(-60, 60), vy: rand(-240, -120), grav: 260, life: rand(0.8, 1.6), maxLife: 1.6,
    size: rand(1.8, 3.4), color: pick(['#ffd700', '#ffe066', '#ffb800']) });
  sfx.fanfare();
  save();
});
$('payNo').addEventListener('click', () => {
  payNoClicks++;
  const card = $('payCard');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  if (payNoClicks === 1) {
    floatText(cx, potTopY - 120, '拒绝失败：余额还够再氪一单', '#ff6b6b');

    sfx.crackle();
  } else {
    payModal.classList.add('hidden');
    floatText(cx, potTopY - 120, '拒绝成功（策划已哭晕在厕所）', '#5fd35f');
    merit += 1;
    statMerit.textContent = merit;
    sfx.ding();
    save();
  }
});

/* ================= 初始化 ================= */
window.addEventListener('visibilitychange', () => {
  if (musicBus) musicBus.gain.value = document.hidden ? 0 : 0.55;
});

resize();
load();
requestAnimationFrame(ts => { t = 0; let last = ts; (function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
})(ts); });
})();
